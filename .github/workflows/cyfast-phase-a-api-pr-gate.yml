name: CyFAST Phase A API Persistence Pull Request Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cyfast-phase-a-api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope-check:
    name: Verify authorized integration branch
    if: >-
      github.event.pull_request.head.ref == 'codex/cyfast-phase-a-api-persistence-20260820' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact same-repository branch
        run: |
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "${{ github.event.pull_request.head.ref }}" = "codex/cyfast-phase-a-api-persistence-20260820"

  backend-mysql:
    name: General Management, API, and MySQL 8 validation
    needs: scope-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cyfast_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apis/general_management/package-lock.json

      - name: Install MySQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y default-mysql-client

      - name: Verify lifecycle plugin is registered in the existing startup
        run: |
          grep -q 'CYFAST_EXECUTION_LIFECYCLE_REGISTERED' apis/general_management/index.js
          grep -q 'execution-lifecycle-plugin' apis/general_management/index.js
          node --check apis/general_management/index.js

      - name: Apply additive lifecycle migration
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot cyfast_test < databases/MYSQL/cyfast2/2.0.0/20260820_01_execution_lifecycle_phase_a_up.sql
          mysql -h 127.0.0.1 -uroot cyfast_test -Nse "
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema='cyfast_test'
              AND table_name IN (
                'execution_runs', 'execution_attempts', 'execution_events',
                'execution_artifacts', 'execution_defect_links'
              );" | grep -qx '5'

      - name: Install General Management dependencies
        working-directory: apis/general_management
        run: npm ci

      - name: Run lifecycle core, API, and MySQL tests
        working-directory: apis/general_management
        env:
          CYFAST_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/cyfast_test
        run: |
          node --test test/execution-lifecycle.test.js
          node --test test/execution-lifecycle-integration.test.js
          node --test test/execution-lifecycle-mysql.test.js

      - name: Run complete General Management regression suite
        working-directory: apis/general_management
        run: npm test

      - name: Verify rollback migration in isolated CI database
        if: always()
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot cyfast_test < databases/MYSQL/cyfast2/2.0.0/20260820_01_execution_lifecycle_phase_a_down.sql
          mysql -h 127.0.0.1 -uroot cyfast_test -Nse "
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema='cyfast_test'
              AND table_name IN (
                'execution_runs', 'execution_attempts', 'execution_events',
                'execution_artifacts', 'execution_defect_links'
              );" | grep -qx '0'

  frontend-python:
    name: Frontend production and Python regressions
    needs: scope-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Run frontend Windows regression tests
        working-directory: ui
        run: npm run test:windows

      - name: Build production frontend
        working-directory: ui
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile AI Engine and Test Agent sources
        run: |
          python -m compileall -q ai_engine/app
          python -m compileall -q test_agent/test_agent

  dotnet:
    name: .NET 9 Windows regression gate
    needs: scope-check
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore windows/CyFast.Windows.sln

      - name: Build
        run: dotnet build windows/CyFast.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/CyFast.Windows.sln --configuration Release --no-build --logger "trx;LogFileName=cyfast-phase-a-api-windows-tests.trx"

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyfast-phase-a-api-dotnet-${{ github.event.pull_request.head.sha }}
          path: windows/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  merge-validated-integration:
    name: Merge exact hosted-validated API integration
    needs: [backend-mysql, frontend-python, dotnet]
    if: >-
      success() &&
      github.event.pull_request.head.ref == 'codex/cyfast-phase-a-api-persistence-20260820' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify immutable validated head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_HEAD="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Mark ready and merge the exact validated head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}" || true
          gh api --method PUT "repos/${{ github.repository }}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$EXPECTED_HEAD" \
            -f commit_title='Merge CyFAST Phase A API and persistence integration' \
            -f commit_message='Merges hosted-validated MySQL lifecycle persistence, scoped execution APIs and SSE, capability-aware agent adapters, Storage Service evidence linking, and integration tests.' \
            --jq 'if .merged == true then .sha else error(.message) end'
