name: CyFAST Phase A API Bootstrap

on:
  push:
    branches:
      - codex/cyfast-phase-a-api-persistence-20260820
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyfast-phase-a-api-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/cyfast-phase-a-api-persistence-20260820
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apis/general_management/package-lock.json

      - name: Integrate lifecycle plugin into General Management
        run: node tools/integrate-execution-lifecycle-plugin.js

      - name: Verify entry-point and module syntax
        run: |
          node --check apis/general_management/index.js
          node --check apis/general_management/plugins/execution-lifecycle-plugin.js
          node --check apis/general_management/routes/execution-lifecycle-routes.js
          node --check apis/general_management/database/mysql/repositories/execution-lifecycle-repository.js
          node --check apis/general_management/services/execution_lifecycle/platform-adapter-registry.js
          node --check apis/general_management/services/execution_lifecycle/http-agent-platform-adapter.js
          node --check apis/general_management/services/execution_lifecycle/storage-service-artifact-store.js
          node --check apis/general_management/services/execution_lifecycle/execution-scope.js

      - name: Install General Management dependencies
        working-directory: apis/general_management
        run: npm ci

      - name: Run lifecycle core and integration tests
        working-directory: apis/general_management
        run: |
          node --test test/execution-lifecycle.test.js
          node --test test/execution-lifecycle-integration.test.js

      - name: Run complete General Management regression tests
        working-directory: apis/general_management
        run: npm test

      - name: Check generated diff
        run: git diff --check

      - name: Commit repeat-safe startup integration
        env:
          BRANCH: codex/cyfast-phase-a-api-persistence-20260820
        run: |
          if git diff --quiet; then
            echo 'General Management lifecycle plugin is already integrated.'
            exit 0
          fi
          git config user.name 'cyfast-validation-bot'
          git config user.email 'cyfast-validation-bot@users.noreply.github.com'
          git add apis/general_management/index.js
          git commit -m 'feat(orchestration): register execution lifecycle plugin'
          git push origin "HEAD:${BRANCH}"
